name: Robot en ligne (pièces TUNEPS)
# Télécharge les pièces des offres depuis la partie publique de TUNEPS et les met dans l'application.
# Sans PC, sans connexion TUNEPS, sans IA. Toutes les heures, 24 h/24.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Nombre maximum d'offres"
        default: "40"
  push:
    branches: [claude/robot-en-ligne]
    paths: [robot-telechargement/robot_en_ligne.py, .github/workflows/robot-en-ligne.yml]
concurrency:
  group: robot-en-ligne
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Certificat intermédiaire de TUNEPS
        # TUNEPS n'envoie pas son certificat intermédiaire : on le récupère à l'adresse indiquée dans son certificat.
        run: |
          AIA=$(echo | openssl s_client -connect www.tuneps.tn:443 -servername www.tuneps.tn 2>/dev/null | openssl x509 -noout -ext authorityInfoAccess | grep -o 'CA Issuers - URI:[^ ]*' | sed 's/CA Issuers - URI://' | head -1)
          curl -sS -m 30 -o inter.der "$AIA"
          openssl x509 -inform DER -in inter.der -out inter.pem 2>/dev/null || cp inter.der inter.pem
          cat /etc/ssl/certs/ca-certificates.crt inter.pem > "$RUNNER_TEMP/tuneps-ca.pem"
      - run: pip install requests
      - name: Télécharger les pièces
        env:
          TUNEPS_CA: ${{ runner.temp }}/tuneps-ca.pem
        run: python robot-telechargement/robot_en_ligne.py --max "${{ github.event.inputs.max || '40' }}"
