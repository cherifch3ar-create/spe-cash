name: Robot veille Google (24 h/24)
on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 heures, jour et nuit
  workflow_dispatch:
permissions:
  contents: read
jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Veille des nouveautés et opportunités
        run: python robots/veille_google.py
