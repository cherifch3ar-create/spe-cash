<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0E2A47">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SPE Money Cash Manager</title>
<style>
  :root{--navy:#0E2A47;--navy2:#1F3D64;--blue:#2E6BE6;--blue-soft:#E8F0FE;--grey:#F4F6F9;--grey2:#E3E8EF;--line:#D5DCE6;--ink:#1D2433;--muted:#5B6573;--green:#1E7F4F;--amber:#B7791F;--red:#B4232A;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
  body{background:var(--grey);color:var(--ink);}
  button{cursor:pointer;font-size:14px;}
  .btn{background:var(--blue);color:#fff;border:none;padding:12px 18px;border-radius:12px;font-weight:600;}
  .btn:hover{background:#2457c0;} .btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
  .btn.green{background:var(--green);} .btn.red{background:var(--red);} .btn.navy{background:var(--navy2);}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:9px;}
  .field{margin:11px 0;} .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none;}
  /* Login */
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#0E2A47,#2E6BE6);padding:20px;}
  #login .card{background:#fff;border-radius:20px;padding:38px 32px;width:380px;max-width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  #login .logo{width:74px;height:74px;border:3px solid var(--navy);border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:var(--navy);margin:0 auto 16px;}
  #login h1{font-size:22px;color:var(--navy);} #login .brand{letter-spacing:3px;color:var(--muted);font-size:11px;margin-top:4px;}
  .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:24px;padding:13px;background:#fff;border:1.5px solid var(--line);border-radius:12px;font-weight:600;color:var(--ink);}
  .gbtn:hover{background:var(--grey);}
  .gbtn img{width:20px;height:20px;}
  /* App */
  #app{display:none;min-height:100vh;}
  header{background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 16px;height:58px;gap:10px;position:sticky;top:0;z-index:20;}
  header .logo{width:30px;height:30px;border:2px solid #fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;}
  header .title{font-weight:700;} header .spacer{flex:1;}
  header .chip{background:var(--navy2);padding:6px 11px;border-radius:20px;font-size:13px;display:flex;align-items:center;gap:7px;}
  header .chip img{width:22px;height:22px;border-radius:50%;}
  .bell{position:relative;background:transparent;border:1px solid #34537f;color:#fff;border-radius:9px;padding:7px 10px;display:none;}
  .bell .dot{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border-radius:10px;min-width:17px;height:17px;font-size:10px;display:none;align-items:center;justify-content:center;padding:0 3px;font-weight:700;}
  .layout{display:flex;} nav{width:225px;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 58px);padding:14px 10px;flex-shrink:0;}
  nav a{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:14px;margin-bottom:3px;font-weight:500;}
  nav a:hover{background:var(--grey);} nav a.active{background:var(--blue-soft);color:var(--blue);font-weight:700;} nav a .ic{font-size:17px;width:20px;text-align:center;}
  main{flex:1;padding:24px;max-width:1100px;} @media(max-width:760px){nav{display:none}main{padding:16px}}
  h1{font-size:23px;color:var(--navy);margin-bottom:3px;} .sub{color:var(--muted);font-size:14px;margin-bottom:18px;}
  .grid{display:grid;gap:14px;} .kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));}
  .card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(14,42,71,.06);padding:18px;}
  .kpi .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px;}
  .kpi .lbl{color:var(--muted);font-size:13px;} .kpi .val{font-size:22px;font-weight:800;color:var(--navy);margin-top:3px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;} th{background:var(--navy);color:#fff;text-align:left;padding:9px 11px;font-weight:600;font-size:12.5px;}
  td{border-bottom:1px solid var(--line);padding:9px 11px;} tr:last-child td{border-bottom:none;}
  .sectitle{font-size:16px;font-weight:700;color:var(--navy);margin:22px 0 10px;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;margin:1px;}
  .b-amber{background:#FAEEDA;color:var(--amber);} .b-green{background:#E2F3EA;color:var(--green);} .b-red{background:#F8E3E4;color:var(--red);} .b-blue{background:var(--blue-soft);color:var(--blue);} .b-grey{background:var(--grey2);color:var(--muted);}
  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .modal-bg{position:fixed;inset:0;background:rgba(14,26,48,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal-bg.show{display:flex;} .modal{background:#fff;border-radius:18px;padding:24px;width:460px;max-width:100%;max-height:92vh;overflow:auto;} .modal h3{color:var(--navy);margin-bottom:14px;}
  .modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;}
  .sigpad{border:1px solid var(--line);border-radius:10px;background:var(--grey);touch-action:none;width:100%;}
  .filebox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:7px 0;display:flex;align-items:center;gap:10px;font-size:13px;} .filebox.ok{border-color:var(--green);background:#f2faf5;}
  .ck{display:flex;gap:8px;align-items:center;margin:5px 0;font-size:13px;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;z-index:99;opacity:0;transition:.25s;font-size:14px;text-align:center;max-width:92%;}
  .toast.show{opacity:1;}
  .muted{color:var(--muted);font-size:13px;}
  .note{background:var(--blue-soft);border:1px solid #C6D6EF;border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:14px;} .note.warn{background:#FAEEDA;border-color:#EAD4A3;}
  #updateBar{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--navy);color:#fff;padding:12px 16px;display:none;align-items:center;justify-content:center;gap:14px;z-index:120;font-size:14px;}
  #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--grey);z-index:200;color:var(--muted);}
</style>
</head>
<body>
<div id="splash">Chargement…</div>

<div id="login" style="display:none;">
  <div class="card">
    <div class="logo">SPE</div>
    <div class="brand">SOFT POWER ELEVATION</div>
    <h1>Money Cash Manager</h1>
    <p class="muted" style="margin-top:8px;">Connectez-vous ou inscrivez-vous</p>
    <button class="gbtn" onclick="loginGoogle()"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">Continuer avec Google</button>
    <button class="gbtn" onclick="loginFacebook()" style="margin-top:10px;"><span style="color:#1877F2;font-weight:800;font-size:18px;">f</span> Continuer avec Facebook</button>
    <div style="margin:14px 0 4px;color:var(--muted);font-size:12px;">— ou par email —</div>
    <div class="field" style="text-align:left;margin:8px 0;"><input id="authEmail" type="email" placeholder="Email"></div>
    <div class="field" style="text-align:left;margin:8px 0;"><input id="authPwd" type="password" placeholder="Mot de passe (min. 6)"></div>
    <div style="display:flex;gap:8px;"><button class="btn" style="flex:1;" onclick="emailLogin()">Se connecter</button><button class="btn sec" style="flex:1;" onclick="emailRegister()">S'inscrire</button></div>
    <p class="muted" style="margin-top:14px;font-size:12px;">Inscription immédiate. L'administrateur pourra ajuster votre rôle et vos accès.</p>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">SPE</div>
    <div class="title">Money Cash Manager</div>
    <div class="spacer"></div>
    <button class="bell" id="bell" onclick="openNotifs()">🔔<span class="dot"></span></button>
    <button class="btn sm" onclick="modalGuide()" style="background:transparent;color:#fff;border:1px solid #34537f;">❓ Aide</button>
    <span class="chip" id="userChip"></span>
    <button class="btn sm" onclick="logout()" style="background:transparent;color:#fff;border:1px solid #34537f;">Déconnexion</button>
  </header>
  <div class="layout"><nav id="nav"></nav><main id="main"></main></div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<div id="updateBar"><span>Une mise à jour est disponible.</span><button class="btn sm" style="background:#fff;color:var(--navy);" onclick="applyUpdate()">Mettre à jour</button></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCCQlCRWi1xXHg9riWfMc7nMuLwCoY2cR4",
  authDomain: "spe-money-cash.firebaseapp.com",
  projectId: "spe-money-cash",
  storageBucket: "spe-money-cash.firebasestorage.app",
  messagingSenderId: "477740796468",
  appId: "1:477740796468:web:275beefd1517faabe25861"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
try{ db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}

const ADMIN_EMAIL = "cherifch3ar@gmail.com";
const M = 1000;
const ALLPERMS = {dashboard:'Voir le tableau de bord',approve:'Approuver les dépenses',fund:'Alimenter la caisse',advance:'Transférer des avances',purchase:'Déclarer des achats',users:'Gérer les utilisateurs',reports:'Rapports',audit:'Audit'};
function defaultPerms(role){return role==='admin'?Object.keys(ALLPERMS):role==='caissier'?['dashboard','fund','advance']:role==='responsable'?['dashboard','approve','reports']:role==='comptable'?['dashboard','reports','audit']:['dashboard','purchase'];}

function fmt(mil){return ((mil||0)/M).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:3})+' DT';}
function parseDT(v){const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?0:Math.round(n*M);}
function now(){return new Date();}
function fmtTs(ts){const d=ts&&ts.toDate?ts.toDate():(ts instanceof Date?ts:new Date());return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),4000);}

let ME=null;            // profil utilisateur courant (doc users)
let CURRENT_VIEW='dashboard';
let CACHE={users:[],cashboxes:{},purchases:[],notifs:[],audit:[],cashops:[],fundings:[],advReqs:[]};
let UNSUB=[];

function can(p){return !!(ME&&ME.perms&&ME.perms.includes(p));}
function priv(){return can('approve')||can('reports')||can('fund')||can('users');}

// ---------------- AUTH ----------------
function loginGoogle(){
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(e=>{ if(e.code==='auth/popup-blocked'||e.code==='auth/cancelled-popup-request'){auth.signInWithRedirect(provider);} else {toast('Connexion annulée ou échouée.');} });
}
function loginFacebook(){ const p=new firebase.auth.FacebookAuthProvider(); auth.signInWithPopup(p).catch(e=>{ if(e.code==='auth/operation-not-allowed'){toast('Facebook pas encore activé (config en attente). Utilisez Google ou Email.');} else if(e.code==='auth/popup-blocked'){auth.signInWithRedirect(p);} else if(e.code!=='auth/cancelled-popup-request'){toast('Connexion Facebook échouée.');} }); }
function emailLogin(){ const e=(document.getElementById('authEmail').value||'').trim(); const p=document.getElementById('authPwd').value; if(!e||!p){toast('Email et mot de passe requis.');return;} auth.signInWithEmailAndPassword(e,p).catch(err=>{ toast(err.code==='auth/operation-not-allowed'?'Connexion email pas encore activée.':((err.code||'').includes('wrong-password')||(err.code||'').includes('user-not-found')||(err.code||'').includes('invalid-credential')?'Email ou mot de passe incorrect.':'Échec : '+err.code)); }); }
function emailRegister(){ const e=(document.getElementById('authEmail').value||'').trim(); const p=document.getElementById('authPwd').value; if(!e||!e.includes('@')||p.length<6){toast('Email valide + mot de passe d\'au moins 6 caractères.');return;} auth.createUserWithEmailAndPassword(e,p).catch(err=>{ toast(err.code==='auth/operation-not-allowed'?'Inscription email pas encore activée.':(err.code==='auth/email-already-in-use'?'Cet email a déjà un compte — utilisez Se connecter.':'Échec : '+err.code)); }); }
function showPending(email){ document.getElementById('app').style.display='none'; const lg=document.getElementById('login'); lg.style.display='flex'; lg.querySelector('.card').innerHTML='<div class="logo" style="margin:0 auto 16px;width:74px;height:74px;border:3px solid var(--navy);border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:var(--navy);">SPE</div><h1 style="color:var(--navy);">Inscription en attente</h1><p class="muted" style="margin-top:10px;">Votre compte <b>'+email+'</b> est enregistré. L\'administrateur doit autoriser votre accès. Réessayez ensuite.</p><button class="btn" style="width:100%;margin-top:20px;" onclick="location.reload()">Actualiser</button><button class="btn sec" style="width:100%;margin-top:10px;" onclick="logout()">Se déconnecter</button>'; }
function showRefused(email){ document.getElementById('app').style.display='none'; const lg=document.getElementById('login'); lg.style.display='flex'; lg.querySelector('.card').innerHTML='<div class="logo" style="margin:0 auto 16px;width:74px;height:74px;border:3px solid var(--red);border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:var(--red);">SPE</div><h1 style="color:var(--red);">Accès refusé</h1><p class="muted" style="margin-top:10px;">L\'inscription de <b>'+email+'</b> a été refusée par l\'administrateur.</p><button class="btn sec" style="width:100%;margin-top:20px;" onclick="logout()">Se déconnecter</button>'; }
function logout(){ UNSUB.forEach(u=>{try{u()}catch(e){}});UNSUB=[]; auth.signOut(); }

auth.onAuthStateChanged(async (user)=>{
  document.getElementById('splash').style.display='none';
  if(!user){ ME=null; document.getElementById('app').style.display='none'; document.getElementById('login').style.display='flex'; return; }
  // Résoudre le profil
  try{
    const email=(user.email||'').toLowerCase();
    let prof=null;
    // chercher par uid
    const byUid=await db.collection('users').doc(user.uid).get();
    if(byUid.exists){ prof={id:user.uid,...byUid.data()}; }
    if(!prof){
      // chercher par email (compte pré-autorisé par l'admin)
      const q=await db.collection('users').where('email','==',email).limit(1).get();
      if(!q.empty){ const d=q.docs[0]; prof={id:d.id,...d.data()};
        // migrer vers doc indexé par uid
        await db.collection('users').doc(user.uid).set({...d.data(),uid:user.uid,photoUrl:user.photoURL||d.data().photoUrl||null},{merge:true});
        if(d.id!==user.uid){ try{await db.collection('users').doc(d.id).delete();}catch(e){} }
        prof={id:user.uid,...d.data(),uid:user.uid};
      }
    }
    if(!prof && email===ADMIN_EMAIL){
      // bootstrap admin
      const adminDoc={uid:user.uid,prenom:(user.displayName||'Admin').split(' ')[0],nom:'',email:email,role:'admin',perms:Object.keys(ALLPERMS),actif:true,photoUrl:user.photoURL||null,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
      await db.collection('users').doc(user.uid).set(adminDoc);
      await db.collection('cashboxes').doc('general').set({type:'generale',balance:0,currency:'DT'},{merge:true});
      prof={id:user.uid,...adminDoc};
    }
    if(!prof){
      const prov=(user.providerData[0]&&user.providerData[0].providerId)||'email';
      const np={uid:user.uid,prenom:(user.displayName||'').split(' ')[0]||(email.split('@')[0]),nom:(user.displayName||'').split(' ').slice(1).join(' '),email:email,role:'acheteur',perms:['dashboard','purchase'],status:'active',actif:true,provider:prov,photoUrl:user.photoURL||null,createdAt:firebase.firestore.FieldValue.serverTimestamp()};
      await db.collection('users').doc(user.uid).set(np,{merge:true});
      try{ const admins=await db.collection('users').where('role','==','admin').get(); admins.forEach(a=>notify(a.id,'Nouvel inscrit',email+' a rejoint (rôle : acheteur).')); }catch(e){}
      prof={id:user.uid,...np};
    }
    if(prof.status==='refused'){ showRefused(prof.email||email); return; }
    if(!prof.role){ await db.collection('users').doc(prof.id||user.uid).set({role:'acheteur',perms:['dashboard','purchase'],status:'active',actif:true},{merge:true}); prof.role='acheteur'; prof.perms=['dashboard','purchase']; prof.actif=true; prof.status='active'; }
    if(prof.actif===false){ toast('Compte désactivé.'); logout(); return; }
    ME=prof;
    // s'assurer que la caisse user existe
    if(prof.role!=='comptable'){ db.collection('cashboxes').doc('box_'+user.uid).set({type:'user',ownerUid:user.uid,balance:firebase.firestore.FieldValue.increment(0),currency:'DT'},{merge:true}).catch(()=>{}); }
    audit('CONNEXION','user',user.uid);
    startListeners();
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    CURRENT_VIEW='dashboard'; render();
  }catch(e){ console.error(e); toast('Erreur de chargement du profil : '+e.message); }
});

// ---------------- LISTENERS TEMPS RÉEL ----------------
function startListeners(){
  UNSUB.forEach(u=>{try{u()}catch(e){}});UNSUB=[];
  UNSUB.push(db.collection('users').onSnapshot(s=>{CACHE.users=s.docs.map(d=>({id:d.id,...d.data()}));softRender();},()=>{}));
  UNSUB.push(db.collection('cashboxes').onSnapshot(s=>{CACHE.cashboxes={};s.docs.forEach(d=>CACHE.cashboxes[d.id]=d.data());softRender();},()=>{}));
  UNSUB.push(db.collection('purchases').orderBy('createdAt','desc').limit(200).onSnapshot(s=>{CACHE.purchases=s.docs.map(d=>({id:d.id,...d.data()}));softRender();},()=>{}));
  UNSUB.push(db.collection('cashOperations').orderBy('createdAt','desc').limit(100).onSnapshot(s=>{CACHE.cashops=s.docs.map(d=>({id:d.id,...d.data()}));softRender();},()=>{}));
  UNSUB.push(db.collection('fundings').orderBy('createdAt','desc').limit(100).onSnapshot(s=>{CACHE.fundings=s.docs.map(d=>({id:d.id,...d.data()}));softRender();},()=>{}));
  UNSUB.push(db.collection('advanceRequests').orderBy('createdAt','desc').limit(100).onSnapshot(s=>{CACHE.advReqs=s.docs.map(d=>({id:d.id,...d.data()}));softRender();},()=>{}));
  UNSUB.push(db.collection('notifications').where('userUid','==',auth.currentUser.uid).limit(50).onSnapshot(s=>{CACHE.notifs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));renderBell();if(CURRENT_VIEW)softRender();},()=>{}));
  if(can('audit')) UNSUB.push(db.collection('auditLogs').orderBy('createdAt','desc').limit(100).onSnapshot(s=>{CACHE.audit=s.docs.map(d=>({id:d.id,...d.data()}));softRender();},()=>{}));
}
let _rt=null; function softRender(){ clearTimeout(_rt); _rt=setTimeout(()=>{ if(ME)render(); },120); }

// ---------------- HELPERS DONNÉES ----------------
function userName(uid){const u=CACHE.users.find(x=>x.uid===uid||x.id===uid);return u?((u.prenom||'')+' '+(u.nom||'')).trim()||u.email:uid;}
function userBy(uid){return CACHE.users.find(x=>x.uid===uid||x.id===uid);}
function bal(id){return (CACHE.cashboxes[id]||{}).balance||0;}
function audit(action,entity,entityId,amount){ if(!auth.currentUser)return; db.collection('auditLogs').add({userUid:auth.currentUser.uid,userName:(ME?((ME.prenom||'')+' '+(ME.nom||'')):auth.currentUser.email),action,entity,entityId:entityId||'',amount:amount||null,device:navigator.userAgent.slice(0,120),createdAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{}); }
function notify(userUid,title,body){ db.collection('notifications').add({userUid,title,body,read:false,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{}); }

async function getIP(){ try{ const r=await fetch('https://api.ipify.org?format=json'); const j=await r.json(); return j.ip; }catch(e){ return 'inconnue'; } }
function getGeo(){ return new Promise(res=>{ if(!navigator.geolocation)return res(null); navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(5),lng:+p.coords.longitude.toFixed(5)}),()=>res(null),{timeout:6000}); }); }

// ---------------- OPÉRATIONS ----------------
async function fundCash(amount,category,note){
  const gRef=db.collection('cashboxes').doc('general');
  const fRef=db.collection('fundings').doc();
  await db.runTransaction(async tx=>{
    const g=await tx.get(gRef); const b=(g.data()?.balance)||0;
    tx.set(gRef,{type:'generale',balance:b+amount,currency:'DT'},{merge:true});
    tx.set(fRef,{amount,category,note:note||null,requestedBy:auth.currentUser.uid,status:'approuve',approverUid:auth.currentUser.uid,approverName:((ME.prenom||'')+' '+(ME.nom||'')).trim(),createdAt:firebase.firestore.FieldValue.serverTimestamp(),decidedAt:firebase.firestore.FieldValue.serverTimestamp()});
    const op=db.collection('cashOperations').doc();
    tx.set(op,{type:'entree',category:category,amount:amount,to:'general',by:auth.currentUser.uid,approvedBy:auth.currentUser.uid,note:note||null,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  });
  audit('ALIMENTATION','funding',fRef.id,amount);
  CACHE.users.filter(u=>u.perms&&u.perms.includes('approve')&&u.actif!==false&&u.id!==auth.currentUser.uid).forEach(u=>notify(u.id,'Caisse alimentée',fmt(amount)+' · '+(category||'')+' · par '+userName(auth.currentUser.uid)));
}
async function decideFunding(id,decision){
  const fRef=db.collection('fundings').doc(id);
  await db.runTransaction(async tx=>{ const s=await tx.get(fRef); if(!s.exists)throw new Error('Introuvable'); const f=s.data(); if(f.status!=='en_attente')throw new Error('Déjà traité'); if(f.requestedBy===auth.currentUser.uid)throw new Error('Séparation des tâches : vous ne pouvez pas autoriser votre propre alimentation'); if(decision==='approuve'){ const gRef=db.collection('cashboxes').doc('general'); const g=await tx.get(gRef); const b=(g.data()?.balance)||0; tx.set(gRef,{type:'generale',balance:b+f.amount,currency:'DT'},{merge:true}); const op=db.collection('cashOperations').doc(); tx.set(op,{type:'entree',category:f.category,amount:f.amount,to:'general',by:f.requestedBy,approvedBy:auth.currentUser.uid,note:f.note,createdAt:firebase.firestore.FieldValue.serverTimestamp()}); } tx.update(fRef,{status:decision,approverUid:auth.currentUser.uid,approverName:((ME.prenom||'')+' '+(ME.nom||'')).trim(),decidedAt:firebase.firestore.FieldValue.serverTimestamp()}); });
  audit(decision==='approuve'?'APPROUVER_ALIMENTATION':'REFUSER_ALIMENTATION','funding',id,null);
  const f=(await fRef.get()).data(); notify(f.requestedBy,'Alimentation '+(decision==='approuve'?'autorisée':'refusée'),fmt(f.amount));
}
async function transferAdvance(toUid,amount,note){
  const genRef=db.collection('cashboxes').doc('general'); const uRef=db.collection('cashboxes').doc('box_'+toUid);
  await db.runTransaction(async tx=>{ const g=await tx.get(genRef); const gb=(g.data()?.balance)||0; if(gb<amount) throw new Error('Fonds insuffisants en caisse générale'); const u=await tx.get(uRef); const ub=(u.data()?.balance)||0; tx.set(genRef,{balance:gb-amount},{merge:true}); tx.set(uRef,{type:'user',ownerUid:toUid,balance:ub+amount,currency:'DT'},{merge:true}); const op=db.collection('cashOperations').doc(); tx.set(op,{type:'avance',category:'alimentation',amount,from:'general',to:'box_'+toUid,by:auth.currentUser.uid,note:note||null,createdAt:firebase.firestore.FieldValue.serverTimestamp()}); });
  audit('TRANSFERER_AVANCE','cashbox','box_'+toUid,amount); notify(toUid,'Avance reçue','Une avance de '+fmt(amount)+' vous a été créditée.');
}
async function createPurchase(p){
  const year=now().getFullYear();
  const ref='PA-'+year+'-'+Date.now().toString().slice(-6);
  const doc=await db.collection('purchases').add({ref,...p,buyerUid:auth.currentUser.uid,cashboxId:'box_'+auth.currentUser.uid,status:'en_attente',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  audit('CREER_ACHAT','purchase',ref,p.amount);
  // notifier les approbateurs
  CACHE.users.filter(u=>u.perms&&u.perms.includes('approve')&&u.actif!==false).forEach(u=>notify(u.uid,'Achat à valider',ref+' · '+p.description+' · '+fmt(p.amount)));
  return doc.id;
}
async function decidePurchase(id,decision,extra){
  const pRef=db.collection('purchases').doc(id);
  await db.runTransaction(async tx=>{
    const snap=await tx.get(pRef); if(!snap.exists)throw new Error('Achat introuvable'); const p=snap.data();
    if(p.status!=='en_attente')throw new Error('Achat déjà traité');
    if(p.buyerUid===auth.currentUser.uid)throw new Error('Séparation des tâches : vous ne pouvez pas valider votre propre achat');
    if(decision==='approuve'){ const cbRef=db.collection('cashboxes').doc(p.cashboxId); const cb=await tx.get(cbRef); const b=(cb.data()?.balance)||0; tx.set(cbRef,{type:'user',ownerUid:p.buyerUid,balance:b-p.amount,currency:'DT'},{merge:true}); } /* dépassement autorisé : le solde peut devenir négatif */
    tx.update(pRef,{status:decision,approverUid:auth.currentUser.uid,approverName:((ME.prenom||'')+' '+(ME.nom||'')).trim(),decidedAt:firebase.firestore.FieldValue.serverTimestamp(),...extra});
    const ap=db.collection('approvals').doc(); tx.set(ap,{purchaseId:id,ref:p.ref,decision,approverUid:auth.currentUser.uid,...extra,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  });
  const p=(await pRef.get()).data();
  audit(decision==='approuve'?'APPROUVER_ACHAT':'REFUSER_ACHAT','purchase',p.ref,p.amount);
  notify(p.buyerUid,'Achat '+(decision==='approuve'?'approuvé':'refusé'),p.ref+(decision==='refuse'?(' · motif : '+(extra.motif||'')):''));
}

// ---------------- DEMANDE DE SOMME ----------------
async function requestAdvance(amount,note){
  await db.collection('advanceRequests').add({amount,note:note||null,requestedBy:auth.currentUser.uid,status:'en_attente',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  audit('DEMANDE_SOMME','advance','',amount);
  CACHE.users.filter(u=>u.perms&&u.perms.includes('approve')&&u.actif!==false).forEach(u=>notify(u.uid||u.id,'Demande de somme',userName(auth.currentUser.uid)+' demande '+fmt(amount)+(note?(' · '+note):'')));
}
async function decideAdvanceRequest(id,decision){
  const rRef=db.collection('advanceRequests').doc(id);
  const snap=await rRef.get(); if(!snap.exists)throw new Error('Demande introuvable'); const r=snap.data();
  if(r.status!=='en_attente')throw new Error('Demande déjà traitée');
  if(r.requestedBy===auth.currentUser.uid)throw new Error('Séparation des tâches : vous ne pouvez pas autoriser votre propre demande');
  if(decision==='approuve'){ await transferAdvance(r.requestedBy,r.amount,'Demande approuvée'+(r.note?(' · '+r.note):'')); }
  await rRef.set({status:decision,approverUid:auth.currentUser.uid,approverName:((ME.prenom||'')+' '+(ME.nom||'')).trim(),decidedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
  audit(decision==='approuve'?'APPROUVER_SOMME':'REFUSER_SOMME','advance',id,r.amount);
  notify(r.requestedBy,'Demande de somme '+(decision==='approuve'?'approuvée':'refusée'),fmt(r.amount));
}

function navItems(){const it=[['dashboard','📊','Tableau de bord'],['purchases','🛍️','Achats']];if(can('fund')||can('advance'))it.push(['cash','💰','Caisse']);if(can('approve'))it.push(['validations','✅','Validations']);if(can('reports'))it.push(['reports','📈','Rapports']);if(can('users')){const np=CACHE.users.filter(u=>u.status==='pending'||(!u.role&&u.actif===false)).length;it.push(['registrations','📝','Inscriptions'+(np?' ('+np+')':'')]);it.push(['users','👥','Utilisateurs']);}if(can('audit'))it.push(['audit','🛡️','Audit']);it.push(['profile','👤','Profil']);return it;}
function go(v){CURRENT_VIEW=v;render();}
function render(){

function roleLabel(r){return {admin:'Administrateur',caissier:'Caissier',acheteur:'Acheteur',responsable:'Responsable',comptable:'Comptable'}[r]||r;}
function kpi(ic,l,v,c){return `<div class="card kpi"><div class="ic" style="background:${c}1f;color:${c}">${ic}</div><div class="lbl">${l}</div><div class="val">${v}</div></div>`;}
function statusBadge(s){return {en_attente:'<span class="badge b-amber">En attente</span>',approuve:'<span class="badge b-green">Approuvé</span>',refuse:'<span class="badge b-red">Refusé</span>'}[s]||s;}
function emptyRow(t,c){return `<tr><td colspan="${c||5}" style="text-align:center;color:var(--muted);padding:18px;">${t}</td></tr>`;}

function viewDashboard(){
  const today=new Date().toDateString();

  const dayExp=appr.filter(p=>p.decidedAt&&p.decidedAt.toDate&&p.decidedAt.toDate().toDateString()===today).reduce((s,p)=>s+p.amount,0);
  const monExp=appr.filter(p=>p.decidedAt&&p.decidedAt.toDate&&p.decidedAt.toDate().getMonth()===now().getMonth()).reduce((s,p)=>s+p.amount,0);
  const pending=CACHE.purchases.filter(p=>p.status==='en_attente').length;
  const P=priv(); const kpis=[];
  if(P)kpis.push(kpi('🏦','Caisse générale',fmt(bal('general')),'var(--navy)')); else {const mb=bal('box_'+ME.uid);kpis.push(kpi('👛','Mon solde',fmt(mb),mb<0?'var(--red)':'var(--blue)'));}
  kpis.push(kpi('📅','Dépenses du jour',fmt(dayExp),'var(--amber)'));

  let usersTable='';

    usersTable=`<div class="sectitle">Soldes par utilisateur</div><div class="card"><table><tr><th>Utilisateur</th><th style="text-align:right;">Solde</th></tr>${rows}</table></div>`; }
  else { usersTable=`<div class="sectitle">Ma situation</div><div class="card"><table><tr><td>Mon solde</td><td style="text-align:right;font-weight:700;">${fmt(bal('box_'+ME.uid))}</td></tr></table></div>`; }
  const list=(P?CACHE.purchases:CACHE.purchases.filter(p=>p.buyerUid===ME.uid)).slice(0,6);

  const chartCard=`<div class="sectitle">Courbe des dépenses (7 derniers jours)</div><div class="card">${barChart(last7DaysExpenses(P?null:ME.uid))}</div>`;
  return `<h1>Tableau de bord</h1><div class="sub">Vue d'ensemble · ${now().toLocaleDateString('fr-FR')} · temps réel</div>${buyerTools}<div class="grid kpis">${kpis.join('')}</div>${chartCard}${usersTable}<div class="sectitle">Derniers achats</div><div class="card"><table><tr><th>Réf.</th><th>Description</th><th>Acheteur</th><th>Montant</th><th>Statut</th></tr>${recent}</table></div>`;
}
function barChart(points){const W=640,H=170,pad=26;const max=Math.max(1,...points.map(p=>Math.abs(p.value)));const bw=(W-pad*2)/points.length;const bars=points.map((p,i)=>{const h=Math.round((Math.abs(p.value)/max)*(H-pad*2));const x=pad+i*bw+bw*0.15;const y=H-pad-h;const col=p.value<0?'var(--red)':'var(--blue)';const val=p.value?fmt(p.value).replace(' DT',''):'';return `<rect x="${x}" y="${y}" width="${bw*0.7}" height="${Math.max(h,1)}" rx="4" fill="${col}"></rect><text x="${x+bw*0.35}" y="${y-4}" font-size="9" fill="#7A879B" text-anchor="middle">${val}</text><text x="${x+bw*0.35}" y="${H-pad+13}" font-size="9" fill="#7A879B" text-anchor="middle">${p.label}</text>`;}).join('');return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)"></line>${bars}</svg>`;}
function last7DaysExpenses(buyerUid){const map={};const appr=CACHE.purchases.filter(p=>p.status==='approuve'&&(!buyerUid||p.buyerUid===buyerUid));appr.forEach(p=>{const d=p.decidedAt&&p.decidedAt.toDate?p.decidedAt.toDate():null;if(!d)return;const k=d.toISOString().slice(0,10);map[k]=(map[k]||0)+p.amount;});const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=d.toISOString().slice(0,10);days.push({label:d.toLocaleDateString('fr-FR',{weekday:'short'}),value:map[k]||0});}return days;}

}

  if(pendP.length){const rows=pendP.map(p=>{const own=p.buyerUid===ME.uid;return `<tr><td><b>${p.ref}</b></td><td>${p.description||''}<div class="muted">${userName(p.buyerUid)}</div></td><td style="font-weight:700;">${fmt(p.amount)}</td><td><button class="btn sm sec" onclick="modalPurchase('${p.id}')">Voir</button> ${own?'<span class="muted">Votre demande</span>':`<button class="btn sm green" onclick="modalApprove('${p.id}')">Approuver</button> <button class="btn sm red" onclick="modalReject('${p.id}')">Refuser</button>`}</td></tr>`;}).join('');html+=`<div class="sectitle">Achats à valider</div><div class="card"><table><tr><th>Réf.</th><th>Description</th><th>Montant</th><th>Action</th></tr>${rows}</table></div>`;}

  const pend=CACHE.users.filter(u=>u.status==='pending'||(!u.role&&u.actif===false));
  const rows=pend.map(u=>`<tr><td>${((u.prenom||'')+' '+(u.nom||'')).trim()||'(sans nom)'}<div class="muted">${u.email||''} · ${u.provider||''}</div></td><td><button class="btn sm green" onclick="modalAuthorize('${u.id}')">Autoriser</button> <button class="btn sm red" onclick="refuseReg('${u.id}')">Refuser</button></td></tr>`).join('')||emptyRow('Aucune demande en attente',2);
  return `<h1>Demandes d'inscription</h1><div class="sub">Autorisez les nouvelles inscriptions et attribuez un rôle</div><div class="note">Quand une personne s'inscrit (Google, Facebook ou email), elle apparaît ici en attente. Autorisez-la pour lui donner accès.</div><div class="card" style="overflow:auto;"><table><tr><th>Demandeur</th><th>Action</th></tr>${rows}</table></div>`;
}
function modalAuthorize(id){const u=CACHE.users.find(x=>x.id===id);if(!u)return;const opts=Object.entries(ALLPERMS).map(([k,v])=>`<label class="ck"><input type="checkbox" class="pck" value="${k}" ${k==='dashboard'?'checked':''}> ${v}</label>`).join('');openModal(`<h3>Autoriser ${u.email||''}</h3><div class="field"><label>Rôle</label><select id="aRole" onchange="presetPerms(this.value)"><option value="acheteur">Acheteur</option><option value="caissier">Caissier</option><option value="responsable">Responsable</option><option value="comptable">Comptable</option><option value="admin">Administrateur</option></select></div><label style="font-size:12px;color:var(--muted);font-weight:600;">Permissions</label><div style="margin:6px 0;">${opts}</div><div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn green" onclick="submitAuthorize('${id}',this)">Autoriser l'accès</button></div>`);presetPerms('acheteur');}
async function submitAuthorize(id,btn){const role=document.getElementById('aRole').value;const perms=Array.from(document.querySelectorAll('.pck:checked')).map(c=>c.value);if(!perms.includes('dashboard'))perms.push('dashboard');btn.disabled=true;try{await db.collection('users').doc(id).set({role,perms,actif:true,status:'active'},{merge:true});const u=CACHE.users.find(x=>x.id===id);if(u&&u.uid&&role!=='comptable')db.collection('cashboxes').doc('box_'+u.uid).set({type:'user',ownerUid:u.uid,balance:firebase.firestore.FieldValue.increment(0),currency:'DT'},{merge:true});audit('AUTORISER_INSCRIPTION','user',(u&&u.email)||id);notify(id,'Accès autorisé','Votre compte a été autorisé. Actualisez l\'application.');closeModal();toast('Compte autorisé.');}catch(e){toast('Erreur : '+e.message);btn.disabled=false;}}
async function refuseReg(id){try{await db.collection('users').doc(id).set({status:'refused',actif:false},{merge:true});audit('REFUSER_INSCRIPTION','user',id);notify(id,'Inscription refusée','Votre demande d\'accès a été refusée.');toast('Inscription refusée.');}catch(e){toast('Erreur : '+e.message);}}

function viewProfile(){
  return `<h1>Profil</h1><div class="sub">${userName(ME.uid)} · ${roleLabel(ME.role)}</div><div class="card" style="max-width:520px;"><p style="margin-bottom:8px;"><b>Email :</b> ${ME.email}</p><p style="margin-bottom:8px;"><b>Rôle :</b> ${roleLabel(ME.role)}</p><div class="field"><label>Téléphone (pour la traçabilité des approbations)</label><input id="profPhone" value="${ME.phone||''}" placeholder="ex. 60 123 456"></div><div class="field"><label>Appareil</label><input id="profDevice" value="${ME.device||''}" placeholder="ex. Infinix Note 30"></div><button class="btn" onclick="saveProfile()">Enregistrer</button></div>`;
}
async function saveProfile(){ const phone=document.getElementById('profPhone').value.trim(); const device=document.getElementById('profDevice').value.trim(); await db.collection('users').doc(ME.uid).set({phone,device},{merge:true}); ME.phone=phone;ME.device=device; toast('Profil enregistré.'); }
async function toggleActive(id,cur){ await db.collection('users').doc(id).set({actif:!cur},{merge:true}); toast('Statut mis à jour.'); }

// ---------------- NOTIFICATIONS ----------------
function renderBell(){const b=document.getElementById('bell');if(!b||!ME)return;b.style.display=can('approve')?'inline-flex':'none';const c=CACHE.notifs.filter(n=>!n.read).length;const d=b.querySelector('.dot');d.textContent=c;d.style.display=c>0?'flex':'none';}
function openNotifs(){const list=CACHE.notifs.map(n=>`<div class="filebox ${n.read?'':'ok'}" style="cursor:pointer" onclick="readNotif('${n.id}')"><span>🔔</span><div style="flex:1"><b>${n.title}</b><div class="muted">${n.body||''} · ${fmtTs(n.createdAt)}</div></div>${n.read?'':'<span class="badge b-red">nouveau</span>'}</div>`).join('')||'<p class="muted">Aucune notification</p>';openModal(`<h3>Notifications</h3>${list}<div class="actions"><button class="btn sec" onclick="closeModal()">Fermer</button></div>`);}
function readNotif(id){db.collection('notifications').doc(id).set({read:true},{merge:true});closeModal();go('validations');}

// ---------------- MODALES ----------------
const modalBg=document.getElementById('modalBg'),modalEl=document.getElementById('modal');
function openModal(h){modalEl.innerHTML=h;modalBg.classList.add('show');}
function closeModal(){modalBg.classList.remove('show');}
modalBg.addEventListener('click',e=>{if(e.target===modalBg)closeModal();});

function modalFund(){const c={vente:'Vente',apport:'Apport',alimentation:'Alimentation'};openModal(`<h3>Alimenter la caisse générale</h3><div class="field"><label>Montant (DT)</label><input id="fAmt" type="number" placeholder="ex. 10000"></div><div class="field"><label>Source</label><select id="fCat">${Object.entries(c).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field"><label>Note</label><input id="fNote"></div><div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn" onclick="submitFund(this)">Valider</button></div>`);}
async function submitFund(btn){const a=parseDT(document.getElementById('fAmt').value);if(a<=0)return;btn.disabled=true;try{await fundCash(a,document.getElementById('fCat').value,document.getElementById('fNote').value);closeModal();toast('Caisse alimentée : '+fmt(a));}catch(e){toast('Erreur : '+e.message);btn.disabled=false;}}
function modalAdvance(){const resp=CACHE.users.filter(u=>u.role==='acheteur'||u.perms&&u.perms.includes('purchase'));openModal(`<h3>Transférer une avance</h3><div class="field"><label>Bénéficiaire</label><select id="aTo">${resp.map(u=>`<option value="${u.uid}">${userName(u.uid)}</option>`).join('')||'<option value="">— aucun acheteur —</option>'}</select></div><div class="field"><label>Montant (DT)</label><input id="aAmt" type="number" placeholder="ex. 5000"></div><div class="field"><label>Note</label><input id="aNote"></div><div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn navy" onclick="submitAdvance(this)">Transférer</button></div>`);}
async function submitAdvance(btn){const a=parseDT(document.getElementById('aAmt').value);const to=document.getElementById('aTo').value;if(a<=0||!to){toast('Renseignez bénéficiaire et montant.');return;}btn.disabled=true;try{await transferAdvance(to,a,document.getElementById('aNote').value);closeModal();toast('Avance transférée : '+fmt(a));}catch(e){toast('Erreur : '+e.message);btn.disabled=false;}}
function modalRequest(){openModal(`<h3>Demander une somme</h3><p class="muted" style="margin-bottom:6px;">Votre demande est envoyée à l'administration pour approbation. À l'accord, le montant est crédité sur votre solde.</p><div class="field"><label>Montant (DT)</label><input id="rqAmt" type="number" placeholder="ex. 500"></div><div class="field"><label>Motif</label><input id="rqNote" placeholder="ex. achat fournitures"></div><div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn" onclick="submitRequest(this)">Envoyer la demande</button></div>`);}
async function submitRequest(btn){const a=parseDT(document.getElementById('rqAmt').value);if(a<=0){toast('Montant requis.');return;}btn.disabled=true;try{await requestAdvance(a,document.getElementById('rqNote').value.trim());closeModal();toast('Demande envoyée pour approbation : '+fmt(a));}catch(e){toast('Erreur : '+e.message);btn.disabled=false;}}

let pendingPhoto=null;
function modalNewPurchase(){pendingPhoto=null;const c={achat:'Achat',carburant:'Carburant',fournisseur:'Fournisseur',maintenance:'Maintenance',divers:'Divers'};openModal(`<h3>Déclarer un achat</h3><div class="field"><label>Fournisseur</label><input id="pSup" placeholder="ex. Métal Pro"></div><div class="field"><label>Montant (DT)</label><input id="pAmt" type="number" placeholder="ex. 1300"></div><div class="field"><label>Catégorie</label><select id="pCat">${Object.entries(c).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field"><label>Description</label><input id="pDesc" placeholder="ex. Achat matériel"></div><label style="font-size:12px;color:var(--muted);font-weight:600;">Photo de facture (obligatoire) — PDF/JPG, scan auto</label><div class="filebox" id="fbPhoto"><span>📎</span><div style="flex:1">Facture / photo<div class="muted" id="fnPhoto">Aucun fichier</div></div><label class="btn sm sec" style="margin:0;">Choisir<input type="file" accept="image/jpeg,image/png,application/pdf" style="display:none" onchange="pickPhoto(this)"></label></div><div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn" onclick="submitPurchase(this)">Soumettre</button></div>`);}
function pickPhoto(input){const f=input.files[0];if(!f)return;if(f.type==='application/pdf'){pendingPhoto={name:f.name,type:'pdf',data:null};document.getElementById('fnPhoto').textContent=f.name+' (PDF)';document.getElementById('fbPhoto').classList.add('ok');return;}const fr=new FileReader();fr.onload=e=>{const img=new Image();img.onload=()=>{const max=1000;let w=img.width,h=img.height;if(w>max){h=Math.round(h*max/w);w=max;}const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');x.filter='grayscale(0.2) contrast(1.25) brightness(1.05)';x.drawImage(img,0,0,w,h);pendingPhoto={name:f.name,type:'image',data:cv.toDataURL('image/jpeg',0.7)};document.getElementById('fnPhoto').textContent=f.name+' · scanné ✓';document.getElementById('fbPhoto').classList.add('ok');};img.src=e.target.result;};fr.readAsDataURL(f);}
async function submitPurchase(btn){const amount=parseDT(document.getElementById('pAmt').value);const supplier=document.getElementById('pSup').value.trim();const description=document.getElementById('pDesc').value.trim();const category=document.getElementById('pCat').value;if(amount<=0||!description){toast('Renseignez montant et description.');return;}if(!pendingPhoto){toast('La photo de facture est obligatoire.');return;}btn.disabled=true;try{await createPurchase({amount,supplier,description,category,invoiceName:pendingPhoto.name,invoiceType:pendingPhoto.type,invoiceData:pendingPhoto.data||null});closeModal();toast('Achat déclaré · les responsables sont notifiés.');}catch(e){toast('Erreur : '+e.message);btn.disabled=false;}}
function modalPurchase(id){const p=CACHE.purchases.find(x=>x.id===id);if(!p)return;const canApr=can('approve')&&p.status==='en_attente'&&p.buyerUid!==ME.uid;const img=p.invoiceData?`<img src="${p.invoiceData}" style="max-width:100%;border:1px solid var(--line);border-radius:10px;margin-top:8px;">`:(p.invoiceName?`<div class="filebox ok"><span>📄</span><div>${p.invoiceName}</div></div>`:'<p class="muted">Aucune pièce</p>');openModal(`<h3>${p.ref}</h3><p><b>Description :</b> ${p.description||''}</p><p><b>Fournisseur :</b> ${p.supplier||''}</p><p><b>Montant :</b> ${fmt(p.amount)}</p><p><b>Acheteur :</b> ${userName(p.buyerUid)}</p><p><b>Statut :</b> ${statusBadge(p.status)}</p>${p.approverName?`<p><b>Décidé par :</b> ${p.approverName}</p>`:''}${p.motif?`<p><b>Motif :</b> ${p.motif}</p>`:''}${p.ip?`<p class="muted">IP ${p.ip} · ${p.deviceInfo||''} · tél ${p.phone||'—'} ${p.geo?('· GPS '+p.geo.lat+','+p.geo.lng):''}</p>`:''}<div class="sectitle">Facture</div>${img}${p.signature?`<div class="sectitle">Signature</div><img src="${p.signature}" style="max-width:200px;border:1px solid var(--line);border-radius:8px;">`:''}<div class="actions">${canApr?`<button class="btn green" onclick="closeModal();modalApprove('${p.id}')">Approuver &amp; signer</button><button class="btn red" onclick="closeModal();modalReject('${p.id}')">Refuser</button>`:''}<button class="btn sec" onclick="closeModal()">Fermer</button></div>`);}

let sigCtx,sigDraw=false,sigHas=false,sigCv;
function modalApprove(id){openModal(`<h3>Approuver &amp; signer</h3><p class="muted" style="margin-bottom:6px;">Signez ci-dessous. IP, appareil, téléphone et localisation seront enregistrés.</p><canvas id="sig" class="sigpad" height="170"></canvas><div style="text-align:right;margin-top:6px;"><button class="btn sm sec" onclick="clearSig()">Effacer</button></div><div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn green" id="sigOk" onclick="submitApprove('${id}',this)">Confirmer l'approbation</button></div>`);setupSig();}
function setupSig(){sigCv=document.getElementById('sig');sigCv.width=sigCv.offsetWidth;sigCtx=sigCv.getContext('2d');sigCtx.fillStyle='#F4F6F9';sigCtx.fillRect(0,0,sigCv.width,sigCv.height);sigCtx.strokeStyle='#0E2A47';sigCtx.lineWidth=2.4;sigCtx.lineCap='round';sigHas=false;const pos=e=>{const r=sigCv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};const st=e=>{sigDraw=true;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);e.preventDefault();};const mv=e=>{if(!sigDraw)return;const p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();sigHas=true;e.preventDefault();};const en=()=>sigDraw=false;sigCv.onmousedown=st;sigCv.onmousemove=mv;window.onmouseup=en;sigCv.ontouchstart=st;sigCv.ontouchmove=mv;sigCv.ontouchend=en;}
function clearSig(){sigCtx.fillStyle='#F4F6F9';sigCtx.fillRect(0,0,sigCv.width,sigCv.height);sigHas=false;}
async function submitApprove(id,btn){if(!sigHas){toast('Veuillez signer.');return;}btn.disabled=true;btn.textContent='Enregistrement…';const sig=sigCv.toDataURL('image/png');const ip=await getIP();const geo=await getGeo();try{await decidePurchase(id,'approuve',{signature:sig,ip,geo,deviceInfo:(ME.device||navigator.platform||'').slice(0,60),phone:ME.phone||null});closeModal();toast('Achat approuvé et signé.');}catch(e){toast('Erreur : '+e.message);btn.disabled=false;btn.textContent='Confirmer l\'approbation';}}
function modalReject(id){openModal(`<h3>Refuser l'achat</h3><div class="field"><label>Motif</label><textarea id="rMot" rows="3"></textarea></div><div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn red" onclick="submitReject('${id}',this)">Refuser</button></div>`);}
async function submitReject(id,btn){const m=document.getElementById('rMot').value.trim();if(!m){toast('Indiquez un motif.');return;}btn.disabled=true;const ip=await getIP();try{await decidePurchase(id,'refuse',{motif:m,ip,deviceInfo:(ME.device||navigator.platform||'').slice(0,60),phone:ME.phone||null});closeModal();toast('Achat refusé.');}catch(e){toast('Erreur : '+e.message);btn.disabled=false;}}

function modalNewUser(){const opts=Object.entries(ALLPERMS).map(([k,v])=>`<label class="ck"><input type="checkbox" class="pck" value="${k}" ${k==='dashboard'?'checked':''}> ${v}</label>`).join('');openModal(`<h3>Autoriser un compte</h3><div class="field"><label>Adresse Gmail (identifiant de connexion)</label><input id="uEmail" placeholder="ex. helmi@gmail.com"></div><div class="field"><label>Prénom</label><input id="uPre"></div><div class="field"><label>Nom</label><input id="uNom"></div><div class="field"><label>Rôle</label><select id="uRole" onchange="presetPerms(this.value)"><option value="acheteur">Acheteur</option><option value="caissier">Caissier</option><option value="responsable">Responsable</option><option value="comptable">Comptable</option><option value="admin">Administrateur</option></select></div><label style="font-size:12px;color:var(--muted);font-weight:600;">Permissions</label><div style="margin:6px 0;">${opts}</div><div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn" onclick="submitUser(this)">Autoriser</button></div>`);presetPerms('acheteur');}
function presetPerms(role){const dp=defaultPerms(role);document.querySelectorAll('.pck').forEach(c=>c.checked=dp.includes(c.value));}
async function submitUser(btn){const email=document.getElementById('uEmail').value.trim().toLowerCase();const pre=document.getElementById('uPre').value.trim();if(!email||!email.includes('@')){toast('Adresse Gmail valide requise.');return;}const role=document.getElementById('uRole').value;const perms=Array.from(document.querySelectorAll('.pck:checked')).map(c=>c.value);if(!perms.includes('dashboard'))perms.push('dashboard');btn.disabled=true;try{await db.collection('users').add({email,prenom:pre,nom:document.getElementById('uNom').value.trim(),role,perms,actif:true,uid:null,createdAt:firebase.firestore.FieldValue.serverTimestamp()});audit('AUTORISER_COMPTE','user',email);closeModal();toast('Compte autorisé : '+email+'. Il pourra se connecter avec Google.');}catch(e){toast('Erreur : '+e.message);btn.disabled=false;}}

function modalGuide(){openModal(`<h3>Comment utiliser</h3><div class="note">Connexion par Google (Gmail). Chacun voit seulement son espace.</div><div class="sectitle" style="margin-top:0;">Administrateur</div><ol style="margin:0 0 6px 18px;font-size:13px;line-height:1.7;"><li>Menu Utilisateurs → <b>Autoriser un compte</b> (saisir l'adresse Gmail + rôle + permissions).</li><li>La personne se connecte ensuite avec <b>Se connecter avec Google</b>.</li><li>Alimenter la caisse, transférer des avances, approuver, rapports, audit.</li></ol><div class="sectitle">Acheteur</div><ol style="margin:0 0 6px 18px;font-size:13px;line-height:1.7;"><li>Achats → Nouvel achat → montant, description, <b>photo de facture obligatoire</b>.</li><li>Les responsables reçoivent une notification et approuvent.</li></ol><div class="sectitle">Responsable</div><p style="font-size:13px;">Validations → Approuver &amp; signer (IP, appareil, téléphone, localisation et signature enregistrés) ou Refuser avec motif.</p><div class="actions"><button class="btn sec" onclick="closeModal()">Fermer</button></div>`);}

function exportCSV(){const rows=[['Réf','Date','Acheteur','Description','Catégorie','Montant DT','Statut']];CACHE.purchases.forEach(p=>rows.push([p.ref,fmtTs(p.createdAt),userName(p.buyerUid),(p.description||'').replace(/;/g,' '),p.category||'',(p.amount/M).toFixed(3),p.status]));const csv=rows.map(r=>r.join(';')).join('\n');const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rapport_spe_'+now().toISOString().slice(0,10)+'.csv';a.click();}

// ---------------- PWA ----------------
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
function installApp(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;}else{toast('Menu du navigateur → Ajouter à l\'écran d\'accueil.');}}
let waitingSW=null;
function applyUpdate(){ if(waitingSW){waitingSW.postMessage('skipWaiting');} document.getElementById('updateBar').style.display='none'; setTimeout(()=>location.reload(),300); }
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw&&nw.addEventListener('statechange',()=>{ if(nw.state==='installed'&&navigator.serviceWorker.controller){ waitingSW=nw; document.getElementById('updateBar').style.display='flex'; } });});
    }).catch(()=>{});
    let refreshing=false; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(refreshing)return; refreshing=true; location.reload(); });
  });
}
