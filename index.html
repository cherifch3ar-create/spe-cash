<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPE Cash Management — Soft Power Elevation</title>
<style>
  :root{
    --navy:#16243F;--navy2:#1F365C;--blue:#2E5AAC;--blue-soft:#E8EEF8;
    --grey:#F4F6F9;--grey2:#E3E8EF;--line:#D5DCE6;--ink:#222831;--muted:#5B6573;
    --green:#1E7F4F;--amber:#B7791F;--red:#B4232A;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
  body{background:var(--grey);color:var(--ink);}
  button{cursor:pointer;font-size:14px;}
  #login{position:fixed;inset:0;display:flex;background:linear-gradient(150deg,#16243F,#2E5AAC);}
  #login .left{flex:1;display:flex;align-items:center;justify-content:center;color:#fff;flex-direction:column;}
  #login .left .logo{width:84px;height:84px;border:3px solid #fff;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;}
  #login .card{width:380px;background:#fff;border-radius:16px;padding:34px;margin:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);}
  @media(max-width:800px){#login .left{display:none}}
  .field{margin:12px 0;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;outline:none;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);}
  .btn{background:var(--blue);color:#fff;border:none;padding:12px 18px;border-radius:9px;font-weight:600;}
  .btn:hover{background:#244a8f;}
  .btn.sec{background:#fff;color:var(--navy);border:1.5px solid var(--line);}
  .btn.green{background:var(--green);} .btn.red{background:var(--red);} .btn.navy{background:var(--navy2);}
  .btn.sm{padding:7px 12px;font-size:13px;}
  #app{display:none;min-height:100vh;}
  header{background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 18px;height:58px;gap:12px;position:sticky;top:0;z-index:20;}
  header .logo{width:30px;height:30px;border:2px solid #fff;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;}
  header .title{font-weight:700;}
  header .spacer{flex:1;}
  header select{background:var(--navy2);color:#fff;border:1px solid #34507f;border-radius:8px;padding:7px 10px;}
  header .chip{background:var(--navy2);padding:6px 11px;border-radius:20px;font-size:13px;}
  .bell{position:relative;background:transparent;border:1px solid #34507f;color:#fff;border-radius:8px;padding:7px 10px;display:none;align-items:center;}
  .bell .dot{position:absolute;top:-7px;right:-7px;background:var(--red);color:#fff;border-radius:10px;min-width:17px;height:17px;font-size:10px;display:none;align-items:center;justify-content:center;padding:0 3px;font-weight:700;}
  .layout{display:flex;}
  nav{width:230px;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 58px);padding:14px 10px;flex-shrink:0;}
  nav a{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:14px;margin-bottom:3px;font-weight:500;}
  nav a:hover{background:var(--grey);}
  nav a.active{background:var(--blue-soft);color:var(--blue);font-weight:700;}
  nav a .ic{font-size:17px;width:20px;text-align:center;}
  main{flex:1;padding:26px;max-width:1100px;}
  @media(max-width:760px){nav{display:none}main{padding:16px}}
  h1{font-size:23px;color:var(--navy);margin-bottom:3px;}
  .sub{color:var(--muted);font-size:14px;margin-bottom:20px;}
  .grid{display:grid;gap:14px;}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(22,36,63,.06);padding:18px;}
  .kpi .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:12px;}
  .kpi .lbl{color:var(--muted);font-size:13px;}
  .kpi .val{font-size:22px;font-weight:800;color:var(--navy);margin-top:3px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{background:var(--navy);color:#fff;text-align:left;padding:9px 11px;font-weight:600;font-size:12.5px;}
  td{border-bottom:1px solid var(--line);padding:9px 11px;}
  tr:last-child td{border-bottom:none;}
  .sectitle{font-size:16px;font-weight:700;color:var(--navy);margin:22px 0 10px;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;margin:1px;}
  .b-amber{background:#FBF1DC;color:var(--amber);} .b-green{background:#E2F3EA;color:var(--green);}
  .b-red{background:#F8E3E4;color:var(--red);} .b-blue{background:var(--blue-soft);color:var(--blue);}
  .b-grey{background:var(--grey2);color:var(--muted);} .b-navy{background:#dfe6f1;color:var(--navy);}
  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .modal-bg{position:fixed;inset:0;background:rgba(16,26,48,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:16px;padding:24px;width:460px;max-width:100%;max-height:92vh;overflow:auto;}
  .modal h3{color:var(--navy);margin-bottom:14px;}
  .modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;}
  .sigpad{border:1px solid var(--line);border-radius:10px;background:var(--grey);touch-action:none;width:100%;}
  .filebox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:7px 0;display:flex;align-items:center;gap:10px;font-size:13px;}
  .filebox.ok{border-color:var(--green);background:#f2faf5;}
  .ck{display:flex;gap:8px;align-items:center;margin:5px 0;font-size:13px;}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;z-index:99;opacity:0;transition:.25s;font-size:14px;text-align:center;max-width:90%;}
  .toast.show{opacity:1;}
  .muted{color:var(--muted);font-size:13px;}
  .note{background:var(--blue-soft);border:1px solid #C6D6EF;border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:14px;}
  .note.warn{background:#FBF1DC;border-color:#EAD4A3;}
</style>
</head>
<body>

<div id="login">
  <div class="left">
    <div class="logo">SPE</div>
    <div style="letter-spacing:3px;margin-top:16px;opacity:.85;font-size:12px;">SOFT POWER ELEVATION</div>
    <div style="font-size:30px;font-weight:300;margin-top:6px;">Cash Management</div>
  </div>
  <div class="card">
    <h1 style="font-size:24px;">Connexion</h1>
    <p class="muted" style="margin-bottom:6px;">Démonstration — choisissez un profil</p>
    <div class="field"><label>Utilisateur</label><select id="loginUser"></select></div>
    <div class="field"><label>Mot de passe</label><input type="password" value="demo1234"></div>
    <button class="btn" style="width:100%;margin-top:6px;" onclick="doLogin()">Se connecter</button>
    <p class="muted" style="margin-top:14px;text-align:center;">Chérif (Gérant administratif) · Belgacem (Associé) · Helmi (Responsable) · Sonia (Comptable)</p>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">SPE</div>
    <div class="title">SPE Cash Management</div>
    <div class="spacer"></div>
    <button class="bell" id="bell" onclick="openNotifs()">🔔<span class="dot"></span></button>
    <span class="muted" style="color:#9fb0cc;font-size:12px;">Profil démo :</span>
    <select id="roleSwitch" onchange="switchUser(this.value)"></select>
    <span class="chip" id="userChip"></span>
    <button class="btn sm" onclick="logout()" style="background:transparent;color:#fff;border:1px solid #34507f;">Déconnexion</button>
  </header>
  <div class="layout">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const M=1000;
function fmt(mil){return (mil/M).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:3})+' DT';}
function parseDT(v){const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isNaN(n)?0:Math.round(n*M);}
function uid(){return 'id'+Math.random().toString(36).slice(2,9);}
function now(){return new Date();}
function dt(d){return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
const ROLES={manager:'Gérant',responsable:'Responsable',comptable:'Comptable'};
const ALLPERMS={dashboard:'Voir le tableau de bord',approve:'Approuver les dépenses',fund:'Alimenter la caisse (ajouter espèce)',advance:'Transférer des avances',purchase:'Déclarer des achats',users:'Gérer les utilisateurs',reports:'Générer les rapports',audit:"Consulter l'audit"};
function defaultPerms(role){return role==='manager'?Object.keys(ALLPERMS):role==='comptable'?['dashboard','reports','audit']:['dashboard','purchase'];}

let state={currentUid:null,seq:0,
  users:[
    {uid:'u_cherif',prenom:'Chérif',nom:'Blidi',role:'manager',subtype:'Gérant administratif',fonction:'Gérant administratif',actif:true,perms:Object.keys(ALLPERMS)},
    {uid:'u_belga',prenom:'Belgacem',nom:'',role:'manager',subtype:'Associé',fonction:'Associé',actif:true,perms:Object.keys(ALLPERMS)},
    {uid:'u_helmi',prenom:'Helmi',nom:'',role:'responsable',subtype:'Responsable',fonction:'Responsable chantier',actif:true,perms:['dashboard','purchase']},
    {uid:'u_sonia',prenom:'Sonia',nom:'',role:'comptable',subtype:'Comptable',fonction:'Comptable',actif:true,perms:['dashboard','reports','audit']}],
  accounts:{general:{balance:0}},purchases:[],cashOps:[],audit:[],notifs:[]};
state.users.forEach(u=>{if(u.role!=='comptable')state.accounts['acc_'+u.uid]={balance:0};});

function user(id){return state.users.find(u=>u.uid===id);}
function me(){return user(state.currentUid);}
function can(p){const u=me();return !!(u&&u.perms&&u.perms.includes(p));}
function priv(){return can('approve')||can('reports')||can('fund')||can('users');}
function acc(id){return state.accounts[id]||(state.accounts[id]={balance:0});}
function userName(id){const u=user(id);return u?(u.prenom+' '+(u.nom||'')).trim():id;}
function approverLabel(u){return u?(u.subtype||ROLES[u.role]):'';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),3800);}
function audit(action,entity,entityId,amount){state.audit.unshift({id:uid(),userUid:state.currentUid,action,entity,entityId,amount:amount||null,ip:'192.168.1.'+(10+Math.floor(Math.random()*40)),device:navigator.platform||'Web',at:now()});}

function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();const g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';g.gain.value=0.18;o.frequency.setValueAtTime(880,a.currentTime);o.frequency.setValueAtTime(660,a.currentTime+0.13);o.frequency.setValueAtTime(880,a.currentTime+0.26);o.start();o.stop(a.currentTime+0.4);}catch(e){}}
function addNotif(title,body,link){state.notifs.unshift({id:uid(),title,body,link,read:false,at:now()});renderBell();}
function unreadCount(){return state.notifs.filter(n=>!n.read).length;}
function renderBell(){const b=document.getElementById('bell');if(!b||!me())return;b.style.display=can('approve')?'inline-flex':'none';const c=unreadCount();const d=b.querySelector('.dot');d.textContent=c;d.style.display=c>0?'flex':'none';}
function openNotifs(){const list=state.notifs.map(n=>`<div class="filebox ${n.read?'':'ok'}" style="cursor:pointer" onclick="openNotif('${n.id}')"><span>🔔</span><div style="flex:1"><b>${n.title}</b><div class="muted">${n.body} · ${dt(n.at)}</div></div>${n.read?'':'<span class="badge b-red">nouveau</span>'}</div>`).join('')||'<p class="muted">Aucune notification</p>';openModal(`<h3>Notifications</h3>${list}<div class="actions"><button class="btn sec" onclick="closeModal()">Fermer</button></div>`);}
function openNotif(id){const n=state.notifs.find(x=>x.id===id);if(n)n.read=true;closeModal();renderBell();go('validations');}

function fundCash(a,c,n){acc('general').balance+=a;state.cashOps.unshift({id:uid(),type:'entree',category:c,amount:a,to:'general',by:state.currentUid,at:now(),note:n});audit('ALIMENTER_CAISSE','account','general',a);}
function transferAdvance(to,a,n){if(acc('general').balance<a){toast('Fonds insuffisants en caisse générale');return false;}acc('general').balance-=a;acc('acc_'+to).balance+=a;state.cashOps.unshift({id:uid(),type:'avance',category:'avance_utilisateur',amount:a,from:'general',to:'acc_'+to,by:state.currentUid,at:now(),note:n});audit('TRANSFERER_AVANCE','account','acc_'+to,a);return true;}
function createPurchase(p){state.seq++;const ref='PA-'+now().getFullYear()+'-'+String(state.seq).padStart(6,'0');const pu={id:uid(),ref,...p,requestedBy:state.currentUid,status:'enAttente',accountId:'acc_'+state.currentUid,at:now(),approvedBy:null,approverType:null,approvedAt:null,reason:null,signature:null};state.purchases.unshift(pu);audit('CREER_ACHAT','purchase',ref,p.montant);addNotif('Nouvel achat à valider',ref+' · '+p.description+' · '+fmt(p.montant),pu.id);return pu;}
function approvePurchase(id,sig){const p=state.purchases.find(x=>x.id===id);if(!p)return;if(!can('approve')){toast('Vous n\'avez pas la permission d\'approuver.');return;}if(p.requestedBy===state.currentUid){toast('Séparation des tâches : vous ne pouvez pas valider votre propre dépense.');return;}const credit=(p.mode==='credit');if(!credit&&acc(p.accountId).balance<p.montant){toast('Solde insuffisant sur le compte du responsable.');return;}if(!credit)acc(p.accountId).balance-=p.montant;p.status='approuve';p.approvedBy=state.currentUid;p.approverType=approverLabel(me());p.approvedAt=now();p.signature=sig;state.notifs.forEach(n=>{if(n.link===id)n.read=true;});audit(credit?'APPROUVER_ACHAT_CREDIT':'APPROUVER_ACHAT','purchase',p.ref,p.montant);if(sig)audit('SIGNER','purchase',p.ref);toast(credit?('Achat '+p.ref+' approuvé à crédit fournisseur (aucun décaissement).'):('Achat '+p.ref+' approuvé par '+p.approverType+'. Solde '+userName(p.requestedBy)+' : '+fmt(acc(p.accountId).balance)));render();}
function rejectPurchase(id,r){const p=state.purchases.find(x=>x.id===id);if(!p)return;p.status='rejete';p.approvedBy=state.currentUid;p.approverType=approverLabel(me());p.approvedAt=now();p.reason=r;state.notifs.forEach(n=>{if(n.link===id)n.read=true;});audit('REJETER_ACHAT','purchase',p.ref);toast('Achat '+p.ref+' rejeté.');render();}

let currentView='dashboard';
function initLoginSelect(){document.getElementById('loginUser').innerHTML=state.users.map(u=>`<option value="${u.uid}">${userName(u.uid)} — ${approverLabel(u)}</option>`).join('');}
function doLogin(){state.currentUid=document.getElementById('loginUser').value;enterApp();}
function switchUser(id){state.currentUid=id;currentView='dashboard';render();}
function logout(){document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';}
function enterApp(){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';const rs=document.getElementById('roleSwitch');rs.innerHTML=state.users.map(u=>`<option value="${u.uid}">${userName(u.uid)} (${approverLabel(u)})</option>`).join('');rs.value=state.currentUid;currentView='dashboard';render();}
function navItems(){const items=[['dashboard','📊','Tableau de bord'],['purchases','🛍️','Achats']];if(can('fund')||can('advance'))items.push(['cash','💰','Caisse']);if(can('approve'))items.push(['validations','✅','Validations']);if(can('reports'))items.push(['reports','📈','Rapports']);if(can('users'))items.push(['users','👥','Utilisateurs']);if(can('audit'))items.push(['audit','🛡️','Audit']);items.push(['profile','👤','Profil']);return items;}
function render(){document.getElementById('userChip').textContent=userName(state.currentUid)+' · '+approverLabel(me());document.getElementById('roleSwitch').value=state.currentUid;document.getElementById('nav').innerHTML=navItems().map(([v,ic,lbl])=>`<a class="${v===currentView?'active':''}" onclick="go('${v}')"><span class="ic">${ic}</span>${lbl}</a>`).join('');document.getElementById('main').innerHTML=({dashboard:viewDashboard,purchases:viewPurchases,cash:viewCash,validations:viewValidations,reports:viewReports,users:viewUsers,audit:viewAudit,profile:viewProfile}[currentView]||viewDashboard)();renderBell();}
function go(v){currentView=v;render();}

function kpi(ic,lbl,val,color){return `<div class="card kpi"><div class="ic" style="background:${color}1f;color:${color}">${ic}</div><div class="lbl">${lbl}</div><div class="val">${val}</div></div>`;}
function statusBadge(s){return {enAttente:'<span class="badge b-amber">En attente</span>',approuve:'<span class="badge b-green">Approuvé</span>',rejete:'<span class="badge b-red">Rejeté</span>'}[s]||s;}
function purchaseRow(p){return `<tr><td><b>${p.ref}</b></td><td>${p.description}</td><td>${userName(p.requestedBy)}</td><td style="font-weight:700;">${fmt(p.montant)}</td><td>${statusBadge(p.status)}</td></tr>`;}
function emptyRow(t){return `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:18px;">${t}</td></tr>`;}

function weekStart(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-day);return x;}
function fundingTotals(){const n=now();const ws=weekStart(n);let wk=0,mo=0,yr=0;state.cashOps.filter(o=>o.type==='entree').forEach(o=>{if(o.at.getFullYear()===n.getFullYear()){yr+=o.amount;if(o.at.getMonth()===n.getMonth())mo+=o.amount;if(o.at>=ws)wk+=o.amount;}});return {wk,mo,yr};}
function fundingByUser(){const n=now();const map={};state.cashOps.filter(o=>o.type==='entree').forEach(o=>{map[o.by]=map[o.by]||{mois:0,annee:0};if(o.at.getFullYear()===n.getFullYear()){map[o.by].annee+=o.amount;if(o.at.getMonth()===n.getMonth())map[o.by].mois+=o.amount;}});return map;}
function userStats(id){const n=now();const recu=state.cashOps.filter(o=>o.type==='avance'&&o.to==='acc_'+id).reduce((s,o)=>s+o.amount,0);const payeAnnee=state.purchases.filter(p=>p.requestedBy===id&&p.status==='approuve'&&p.mode!=='credit'&&p.approvedAt&&p.approvedAt.getFullYear()===n.getFullYear()).reduce((s,p)=>s+p.montant,0);const enAttente=state.purchases.filter(p=>p.requestedBy===id&&p.status==='enAttente').reduce((s,p)=>s+p.montant,0);const reste=acc('acc_'+id).balance;return {recu,payeAnnee,reste,aJustifier:reste,enAttente};}

function viewDashboard(){
  const today=new Date().toDateString();
  const P=priv();
  const dayExp=state.purchases.filter(p=>p.status==='approuve'&&p.mode!=='credit'&&p.approvedAt&&p.approvedAt.toDateString()===today).reduce((s,p)=>s+p.montant,0);
  const monExp=state.purchases.filter(p=>p.status==='approuve'&&p.mode!=='credit'&&p.approvedAt&&p.approvedAt.getMonth()===now().getMonth()).reduce((s,p)=>s+p.montant,0);
  const pending=state.purchases.filter(p=>p.status==='enAttente').length;
  const kpis=[];
  if(P)kpis.push(kpi('🏦','Caisse générale',fmt(acc('general').balance),'var(--navy)'));
  else kpis.push(kpi('👛','Mon solde',fmt(acc('acc_'+state.currentUid).balance),'var(--blue)'));
  kpis.push(kpi('📅','Dépenses du jour',fmt(dayExp),'var(--amber)'));
  kpis.push(kpi('🗓️','Dépenses du mois',fmt(monExp),'var(--green)'));
  kpis.push(kpi('⏳','En attente',pending,'var(--red)'));
  const ft=fundingTotals();
  const fundTiles=`<div class="sectitle">Fond de caisse alimenté</div><div class="grid kpis">
    ${kpi('📆','Cette semaine',fmt(ft.wk),'var(--blue)')}
    ${kpi('🗓️','Ce mois',fmt(ft.mo),'var(--navy2)')}
    ${kpi('📅','Cette année',fmt(ft.yr),'var(--navy)')}</div>`;
  let byWho='';
  if(P){
    const fb=fundingByUser();
    const rows=Object.entries(fb).map(([k,v])=>`<tr><td>${userName(k)} <span class="muted">(${approverLabel(user(k))})</span></td><td style="text-align:right;">${fmt(v.mois)}</td><td style="text-align:right;font-weight:700;">${fmt(v.annee)}</td></tr>`).join('')||emptyRow('Aucune alimentation');
    byWho=`<div class="sectitle">Alimentations par gérant — qui a alimenté</div><div class="card"><table>
      <tr><th>Gérant</th><th style="text-align:right;">Ce mois</th><th style="text-align:right;">Cette année</th></tr>${rows}</table></div>`;
  }
  let outTable='';
  if(P){
    const rows=state.users.filter(u=>u.role!=='comptable').map(u=>{const st=userStats(u.uid);return `<tr style="cursor:pointer" onclick="modalUserDetail('${u.uid}')">
      <td>${userName(u.uid)}</td><td style="text-align:right;">${fmt(st.recu)}</td><td style="text-align:right;">${fmt(st.payeAnnee)}</td>
      <td style="text-align:right;font-weight:700;">${fmt(st.reste)}</td>
      <td style="text-align:right;">${st.aJustifier>0?`<span class="badge b-amber">${fmt(st.aJustifier)}</span>`:'<span class="badge b-green">0 DT</span>'}</td>
      <td><span class="badge b-blue">Détail ›</span></td></tr>`;}).join('');

}

function viewCash(){const ops=state.cashOps.slice(0,14).map(o=>{const ic=o.type==='entree'?'⬇️':(o.type==='avance'?'↔️':'⬆️');const lbl=o.type==='avance'?'Avance → '+userName((o.to||'').replace('acc_','')):(o.type==='entree'?'Entrée':'Sortie');return `<tr><td>${ic} ${lbl}</td><td>${o.category}</td><td>${o.note||''}</td><td style="text-align:right;font-weight:700;">${fmt(o.amount)}</td><td class="muted">${dt(o.at)}</td></tr>`;}).join('')||emptyRow('Aucun mouvement');const btns=`${can('fund')?'<button class="btn" onclick="modalFund()">＋ Alimenter la caisse</button>':''}${can('advance')?'<button class="btn navy" onclick="modalAdvance()">↔ Transférer une avance</button>':''}`;return `<h1>Gestion de la caisse</h1><div class="sub">Caisse générale et avances</div><div class="grid kpis"><div style="max-width:320px;">${kpi('🏦','Caisse générale',fmt(acc('general').balance),'var(--navy)')}</div></div><div class="toolbar" style="margin-top:14px;">${btns}</div><div class="sectitle">Mouvements récents</div><div class="card"><table><tr><th>Type</th><th>Catégorie</th><th>Note</th><th style="text-align:right;">Montant</th><th>Date</th></tr>${ops}</table></div>`;}

function viewPurchases(){const seeAll=can('approve')||can('reports')||can('users');let list=seeAll?state.purchases:state.purchases.filter(p=>p.requestedBy===state.currentUid);const rows=list.map(p=>`<tr><td><b>${p.ref}</b></td><td>${p.description}<div class="muted">${p.fournisseur} · ${p.categorie} · ${p.mode==='credit'?'<span class="badge b-amber">Crédit fournisseur</span>':'Espèces'}</div></td><td style="font-weight:700;">${fmt(p.montant)}</td><td>${statusBadge(p.status)}${p.approverType?`<div class="muted">par ${p.approverType}</div>`:''}</td><td><button class="btn sm sec" onclick="modalPurchase('${p.id}')">Détail</button></td></tr>`).join('')||emptyRow('Aucun achat');return `<h1>Achats</h1><div class="sub">Déclaration et suivi des achats</div>${can('purchase')?`<div class="toolbar"><button class="btn" onclick="modalNewPurchase()">＋ Nouvel achat</button></div>`:''}<div class="card"><table><tr><th>Réf.</th><th>Description</th><th>Montant</th><th>Statut</th><th></th></tr>${rows}</table></div>`;}

function viewValidations(){const pending=state.purchases.filter(p=>p.status==='enAttente');if(!pending.length)return `<h1>Validations</h1><div class="sub">Dépenses en attente</div><div class="card" style="text-align:center;padding:34px;"><div style="font-size:34px;">✅</div><p class="muted" style="margin-top:8px;">Aucune dépense en attente.</p></div>`;const rows=pending.map(p=>{const own=p.requestedBy===state.currentUid;return `<tr><td><b>${p.ref}</b></td><td>${p.description}<div class="muted">${userName(p.requestedBy)} · ${p.docs?Object.keys(p.docs).length+' justificatifs':''}</div></td><td style="font-weight:700;">${fmt(p.montant)}</td><td><button class="btn sm sec" onclick="modalPurchase('${p.id}')">Voir pièces</button> ${own?'<span class="muted">Votre demande</span>':`<button class="btn sm green" onclick="modalApprove('${p.id}')">Approuver</button> <button class="btn sm red" onclick="modalReject('${p.id}')">Rejeter</button>`}</td></tr>`;}).join('');return `<h1>Validations</h1><div class="sub">${pending.length} dépense(s) en attente</div><div class="note warn">Un gérant ne peut pas approuver une dépense qu'il a lui-même déclarée (séparation des tâches). L'approbateur (Gérant administratif ou Associé) est enregistré.</div><div class="card"><table><tr><th>Réf.</th><th>Description</th><th>Montant</th><th>Action</th></tr>${rows}</table></div>`;}

function viewReports(){const appr=state.purchases.filter(p=>p.status==='approuve');const cash=appr.filter(p=>p.mode!=='credit');const cred=appr.filter(p=>p.mode==='credit');const total=cash.reduce((s,p)=>s+p.montant,0);const totalCred=cred.reduce((s,p)=>s+p.montant,0);const byCat={};appr.forEach(p=>byCat[p.categorie]=(byCat[p.categorie]||0)+p.montant);const catRows=Object.entries(byCat).map(([c,v])=>`<tr><td>${c}</td><td style="text-align:right;font-weight:700;">${fmt(v)}</td></tr>`).join('')||emptyRow('—');return `<h1>Rapports</h1><div class="sub">Synthèse des dépenses approuvées</div><div class="toolbar"><button class="btn sec" onclick="toast('Démo : la version Flutter génère un PDF réel.')">📄 Export PDF</button><button class="btn sec" onclick="toast('Démo : la version Flutter génère un Excel réel.')">📊 Export Excel</button></div><div class="grid kpis">${kpi('💸','Décaissé (espèces)',fmt(total),'var(--green)')}${kpi('🧾','Crédit fournisseur (dû)',fmt(totalCred),'var(--amber)')}</div><div class="sectitle">Dépenses par catégorie</div><div class="card"><table><tr><th>Catégorie</th><th style="text-align:right;">Montant</th></tr>${catRows}</table></div>`;}

function viewUsers(){const rows=state.users.map(u=>{const chips=u.perms.map(pk=>`<span class="badge b-blue">${ALLPERMS[pk]?ALLPERMS[pk].split(' ')[0]:pk}</span>`).join(' ');return `<tr><td>${userName(u.uid)}</td><td>${u.fonction}</td><td><span class="badge b-navy">${approverLabel(u)}</span></td><td><span class="badge ${u.actif?'b-green':'b-grey'}">${u.actif?'Actif':'Inactif'}</span></td><td style="max-width:230px;">${chips}</td></tr>`;}).join('');return `<h1>Utilisateurs & permissions</h1><div class="sub">Chaque compte a ses options (aucune suppression — statut actif/inactif)</div><div class="toolbar"><button class="btn" onclick="modalNewUser()">＋ Créer un compte</button></div><div class="card" style="overflow:auto;"><table><tr><th>Nom</th><th>Fonction</th><th>Type</th><th>Statut</th><th>Options / permissions</th></tr>${rows}</table></div>`;}

function viewAudit(){const rows=state.audit.slice(0,50).map(a=>`<tr><td class="muted">${dt(a.at)}</td><td>${userName(a.userUid)}</td><td><span class="badge b-blue">${a.action}</span></td><td>${a.entityId}</td><td>${a.amount?fmt(a.amount):''}</td><td class="muted">${a.ip}</td></tr>`).join('')||emptyRow('Aucune action');return `<h1>Journal d'audit</h1><div class="sub">Traçabilité inviolable de toutes les actions</div><div class="card" style="overflow:auto;"><table><tr><th>Date/heure</th><th>Utilisateur</th><th>Action</th><th>Objet</th><th>Montant</th><th>IP</th></tr>${rows}</table></div>`;}

function viewProfile(){const u=me();const chips=u.perms.map(pk=>`<span class="badge b-blue">${ALLPERMS[pk]||pk}</span>`).join(' ');return `<h1>Profil</h1><div class="sub">${userName(u.uid)} · ${approverLabel(u)}</div><div class="card" style="max-width:560px;"><p style="margin-bottom:8px;"><b>Fonction :</b> ${u.fonction}</p><p style="margin-bottom:8px;"><b>Type :</b> ${approverLabel(u)}</p><p style="margin-bottom:8px;"><b>Mes options :</b><br>${chips}</p><p style="margin:10px 0;"><b>Signature :</b> <span class="muted">${u.signature?'Enregistrée':'Non enregistrée'}</span></p>${u.signature?`<img src="${u.signature}" style="border:1px solid var(--line);border-radius:8px;max-width:240px;background:#fff;">`:''}<div style="margin-top:14px;"><button class="btn sec" onclick="modalSignature(s=>{me().signature=s;render();toast('Signature enregistrée.');})">✍ Enregistrer ma signature</button></div></div>`;}

function modalFund(){const c={banque:'Banque',associe:'Associé',paiement_client:'Paiement client',apport_personnel:'Apport personnel'};openModal(`<h3>Alimenter la caisse générale</h3><div class="field"><label>Montant (DT)</label><input id="fAmt" type="number" placeholder="ex. 10000"></div><div class="field"><label>Source</label><select id="fCat">${Object.entries(c).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field"><label>Note</label><input id="fNote" placeholder="optionnel"></div><div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn" onclick="submitFund()">Valider</button></div>`);}

let pendingDocs={};
function modalNewPurchase(){pendingDocs={};const c={fournisseur:'Fournisseur',depense_chantier:'Dépense chantier',avance_utilisateur:'Matériel'};openModal(`<h3>Déclarer un achat</h3><div class="field"><label>Fournisseur</label><input id="pFour" placeholder="ex. Métal Pro"></div><div class="field"><label>Montant (DT)</label><input id="pAmt" type="number" placeholder="ex. 1300"></div><div class="field"><label>Catégorie</label><select id="pCat">${Object.entries(c).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field"><label>Description</label><input id="pDesc" placeholder="ex. Achat matériel ascenseur"></div><div class="field"><label>Mode de paiement</label><select id="pMode"><option value="especes">Espèces (décaissement immédiat)</option><option value="credit">Crédit fournisseur (payé plus tard)</option></select></div><label style="font-size:12px;color:var(--muted);font-weight:600;">Justificatifs (PDF / JPEG) — Bon de livraison obligatoire · Facture/reçu pour paiement espèces · Photo optionnelle (scan auto)</label>${docInput('bl','Bon de livraison (obligatoire)')}${docInput('facture','Facture / reçu (paiement)')}${docInput('photo','Photo (optionnelle)')}<div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn" onclick="submitPurchase()">Soumettre</button></div>`);}
function docInput(k,l){return `<div class="filebox" id="fb_${k}"><span>📎</span><div style="flex:1">${l}<div class="muted" id="fn_${k}">Aucun fichier</div></div><label class="btn sm sec" style="margin:0;">Choisir<input type="file" accept="application/pdf,image/jpeg" style="display:none" onchange="pickDoc('${k}',this)"></label></div>`;}
function markDoc(k,label){document.getElementById('fn_'+k).textContent=label;document.getElementById('fb_'+k).classList.add('ok');}
function scanImage(file,cb){const fr=new FileReader();fr.onload=e=>{const img=new Image();img.onload=()=>{const max=1280;let w=img.width,h=img.height;if(w>max){h=Math.round(h*max/w);w=max;}const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.filter='grayscale(0.25) contrast(1.3) brightness(1.06)';x.drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.85));};img.src=e.target.result;};fr.readAsDataURL(file);}
function pickDoc(k,input){const f=input.files[0];if(!f)return;if(!(f.type==='application/pdf'||f.type==='image/jpeg')){toast('Seuls PDF et JPEG sont acceptés.');return;}if(f.type==='image/jpeg'){scanImage(f,(durl)=>{pendingDocs[k]={name:f.name,url:durl,mime:'image/jpeg',scanned:true};markDoc(k,f.name+' · scanné ✓');});}else{const url=URL.createObjectURL(f);pendingDocs[k]={name:f.name,url,mime:f.type};markDoc(k,f.name);}}
function submitPurchase(){const montant=parseDT(document.getElementById('pAmt').value);const fournisseur=document.getElementById('pFour').value.trim();const description=document.getElementById('pDesc').value.trim();const categorie=document.getElementById('pCat').value;const mode=document.getElementById('pMode').value;if(montant<=0||!fournisseur||!description){toast('Renseignez fournisseur, montant et description.');return;}if(!pendingDocs.bl){toast('Le bon de livraison est obligatoire.');return;}if(mode==='especes'&&!pendingDocs.facture){toast('Achat espèces : la facture ou le reçu est obligatoire (la photo reste optionnelle).');return;}createPurchase({fournisseur,montant,categorie,description,mode,docs:{...pendingDocs}});closeModal();render();beep();toast(mode==='credit'?'Achat à crédit fournisseur déclaré · en attente d\'approbation.':'Achat déclaré · notification envoyée aux gérants pour approbation.');}
function docRow(k,d){const label=({facture:'Facture / reçu',photo:'Photo',bl:'Bon de livraison'})[k]||k;const name=(typeof d==='string')?d:d.name;const url=(typeof d==='object')?d.url:null;const icon=(name||'').toLowerCase().endsWith('.pdf')?'📄':'🖼️';const view=url?`<button class="btn sm sec" onclick="window.open('${url}','_blank')">👁 Voir</button>`:'<span class="muted">(exemple démo)</span>';return `<div class="filebox ok"><span>${icon}</span><div style="flex:1">${label}<div class="muted">${name}</div></div>${view}</div>`;}
function modalPurchase(id){const p=state.purchases.find(x=>x.id===id);const docs=p.docs?Object.entries(p.docs).map(([k,d])=>docRow(k,d)).join(''):'<p class="muted">—</p>';const canApr=can('approve')&&p.status==='enAttente'&&p.requestedBy!==state.currentUid;openModal(`<h3>${p.ref}</h3><p><b>Description :</b> ${p.description}</p><p><b>Fournisseur :</b> ${p.fournisseur}</p><p><b>Montant :</b> ${fmt(p.montant)}</p><p><b>Mode :</b> ${p.mode==='credit'?'<span class="badge b-amber">Crédit fournisseur</span> (payé plus tard)':'Espèces (décaissement immédiat)'}</p><p><b>Demandeur :</b> ${userName(p.requestedBy)}</p><p><b>Statut :</b> ${statusBadge(p.status)}</p>${p.approverType?`<p><b>Approuvé par :</b> ${userName(p.approvedBy)} — ${p.approverType}</p>`:''}${p.reason?`<p><b>Motif rejet :</b> ${p.reason}</p>`:''}${p.signature?`<p style="margin-top:8px;"><b>Signature :</b></p><img src="${p.signature}" style="max-width:200px;border:1px solid var(--line);border-radius:8px;background:#fff;">`:''}<div class="sectitle" style="margin-top:14px;">Justificatifs</div>${docs}<div class="actions">${canApr?`<button class="btn green" onclick="closeModal();modalApprove('${p.id}')">Approuver & signer</button><button class="btn red" onclick="closeModal();modalReject('${p.id}')">Rejeter</button>`:''}${p.status==='approuve'?`<button class="btn navy" onclick="genVoucher('${p.id}')">📄 Bon de paiement</button>`:''}<button class="btn sec" onclick="closeModal()">Fermer</button></div>`);}
function modalReject(id){openModal(`<h3>Rejeter l'achat</h3><div class="field"><label>Motif</label><textarea id="rReason" rows="3"></textarea></div><div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn red" onclick="(function(){var r=document.getElementById('rReason').value;if(!r){toast('Indiquez un motif.');return;}closeModal();rejectPurchase('${id}',r);})()">Rejeter</button></div>`);}
function modalApprove(id){const p=state.purchases.find(x=>x.id===id);modalSignature(s=>{approvePurchase(id,s);},'Signature d\'approbation — '+p.ref);}

let sigCtx,sigDrawing=false,sigHas=false,sigCanvas;
function modalSignature(onConfirm,title){openModal(`<h3>${title||'Signature électronique'}</h3><p class="muted" style="margin-bottom:8px;">Signez ci-dessous (souris ou doigt)</p><canvas id="sig" class="sigpad" height="180"></canvas><div style="text-align:right;margin-top:6px;"><button class="btn sm sec" onclick="clearSig()">Effacer</button></div><div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn green" id="sigConfirm">Confirmer la signature</button></div>`);setupSig(onConfirm);}
function setupSig(onConfirm){sigCanvas=document.getElementById('sig');sigCanvas.width=sigCanvas.offsetWidth;sigCtx=sigCanvas.getContext('2d');sigCtx.fillStyle='#F4F6F9';sigCtx.fillRect(0,0,sigCanvas.width,sigCanvas.height);sigCtx.strokeStyle='#16243F';sigCtx.lineWidth=2.4;sigCtx.lineCap='round';sigCtx.lineJoin='round';sigHas=false;const pos=e=>{const r=sigCanvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return {x:t.clientX-r.left,y:t.clientY-r.top};};const start=e=>{sigDrawing=true;const p=pos(e);sigCtx.beginPath();sigCtx.moveTo(p.x,p.y);e.preventDefault();};const move=e=>{if(!sigDrawing)return;const p=pos(e);sigCtx.lineTo(p.x,p.y);sigCtx.stroke();sigHas=true;e.preventDefault();};const end=()=>{sigDrawing=false;};sigCanvas.onmousedown=start;sigCanvas.onmousemove=move;window.onmouseup=end;sigCanvas.ontouchstart=start;sigCanvas.ontouchmove=move;sigCanvas.ontouchend=end;document.getElementById('sigConfirm').onclick=()=>{if(!sigHas){toast('Veuillez signer.');return;}const data=sigCanvas.toDataURL('image/png');closeModal();onConfirm(data);};}
function clearSig(){sigCtx.fillStyle='#F4F6F9';sigCtx.fillRect(0,0,sigCanvas.width,sigCanvas.height);sigHas=false;}

function modalNewUser(){const opts=Object.entries(ALLPERMS).map(([k,v])=>`<label class="ck"><input type="checkbox" class="permck" value="${k}" ${(k==='dashboard'||k==='purchase')?'checked':''}> ${v}</label>`).join('');openModal(`<h3>Créer un compte</h3><div class="field"><label>Prénom</label><input id="uPre"></div><div class="field"><label>Nom</label><input id="uNom"></div><div class="field"><label>Fonction</label><input id="uFon" placeholder="ex. Responsable chantier"></div><div class="field"><label>Type</label><select id="uRole" onchange="presetPerms(this.value)"><option value="responsable:Responsable">Responsable</option><option value="manager:Gérant administratif">Gérant administratif</option><option value="manager:Associé">Associé</option><option value="comptable:Comptable">Comptable</option></select></div><label style="font-size:12px;color:var(--muted);font-weight:600;">Options / permissions du compte (cochez)</label><div style="margin:6px 0 2px;">${opts}</div><div class="actions"><button class="btn sec" onclick="closeModal()">Annuler</button><button class="btn" onclick="submitUser()">Créer le compte</button></div>`);}
function presetPerms(sel){const role=sel.split(':')[0];const dp=defaultPerms(role);document.querySelectorAll('.permck').forEach(c=>{c.checked=dp.includes(c.value);});}
function submitUser(){const pre=document.getElementById('uPre').value.trim();if(!pre){toast('Prénom requis.');return;}const id='u_'+uid();const sel=document.getElementById('uRole').value;const role=sel.split(':')[0];const subtype=sel.split(':')[1]||ROLES[role];const perms=Array.from(document.querySelectorAll('.permck:checked')).map(c=>c.value);if(perms.length===0)perms.push('dashboard');state.users.push({uid:id,prenom:pre,nom:document.getElementById('uNom').value.trim(),role,subtype,fonction:document.getElementById('uFon').value.trim()||subtype,actif:true,perms});if(role!=='comptable')state.accounts['acc_'+id]={balance:0};audit('CREER_UTILISATEUR','user',id);closeModal();enterApp();render();toast('Compte créé avec ses options.');}

function troisChiffres(n){const u=['','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];let s='';const c=Math.floor(n/100),r=n%100;if(c>0){s+=(c>1?u[c]+'-':'')+'cent';if(c>1&&r===0)s+='s';if(r>0)s+='-';}if(r>0){if(r<20){s+=u[r];}else{const d=Math.floor(r/10),un=r%10;const tens={2:'vingt',3:'trente',4:'quarante',5:'cinquante',6:'soixante',8:'quatre-vingt'};if(d===7){s+='soixante'+(un===1?'-et-onze':'-'+u[10+un]);}else if(d===9){s+='quatre-vingt-'+u[10+un];}else{let base=tens[d];if(d===8&&un===0)base+='s';s+=base;if(un===1&&d!==8)s+='-et-un';else if(un>0)s+='-'+u[un];}}}return s;}
function enLettres(n){if(n===0)return 'zéro';const mille=Math.floor(n/1000),reste=n%1000;let s='';if(mille>0){s+=(mille>1?troisChiffres(mille)+'-':'')+'mille';if(reste>0)s+='-'+troisChiffres(reste);}else s=troisChiffres(reste);return s;}
function montantEnLettres(mil){const d=Math.floor(mil/1000),m=mil%1000;let s=enLettres(d)+' dinar'+(d>1?'s':'');if(m>0)s+=' et '+enLettres(m)+' millime'+(m>1?'s':'');return s.charAt(0).toUpperCase()+s.slice(1);}
function genVoucher(id){const p=state.purchases.find(x=>x.id===id);if(!p)return;const enL=montantEnLettres(p.montant);const dte=new Date(p.approvedAt||p.at).toLocaleDateString('fr-FR');const html=`<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Bon de paiement ${p.ref}</title><style>body{font-family:Arial,sans-serif;color:#16243F;margin:0;padding:36px;background:#f4f6f9;}.v{max-width:720px;margin:auto;background:#fff;border:1px solid #D5DCE6;border-radius:14px;padding:32px;}.hd{display:flex;align-items:center;gap:14px;border-bottom:3px solid #2E5AAC;padding-bottom:16px;}.logo{width:54px;height:54px;border:3px solid #16243F;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;}.brand{font-size:12px;letter-spacing:2px;color:#5B6573;}h1{font-size:20px;margin:2px 0;color:#16243F;}table{width:100%;border-collapse:collapse;margin-top:18px;}td{padding:9px 6px;border-bottom:1px solid #eee;}.lbl{color:#5B6573;width:42%;}.amt{font-size:26px;font-weight:800;color:#16243F;}.lettres{font-style:italic;color:#1F365C;margin-top:14px;background:#E8EEF8;padding:12px 14px;border-radius:8px;}.sig{margin-top:34px;display:flex;justify-content:space-between;align-items:flex-end;}.sigbox{text-align:center;}.sigbox img{height:64px;}.line{border-top:1px solid #16243F;width:210px;margin-top:6px;font-size:12px;color:#5B6573;padding-top:4px;}.btn{background:#2E5AAC;color:#fff;border:none;padding:11px 18px;border-radius:8px;cursor:pointer;font-size:14px;}@media print{.noprint{display:none}body{background:#fff;}}</style></head><body><div class="v"><div class="hd"><div class="logo">SPE</div><div><div class="brand">SOFT POWER ELEVATION</div><h1>Bon de paiement</h1></div><div style="margin-left:auto;text-align:right;font-size:12px;color:#5B6573;">Réf. ${p.ref}<br>${dte}</div></div><table><tr><td class="lbl">Bénéficiaire / Fournisseur</td><td>${p.fournisseur}</td></tr><tr><td class="lbl">Demandeur</td><td>${userName(p.requestedBy)}</td></tr><tr><td class="lbl">Objet</td><td>${p.description}</td></tr><tr><td class="lbl">Mode de paiement</td><td>${p.mode==='credit'?'Crédit fournisseur':'Espèces'}</td></tr><tr><td class="lbl">Montant</td><td><span class="amt">${fmt(p.montant)}</span></td></tr></table><div class="lettres">Arrêté le présent bon à la somme de : <b>${enL}</b>.</div><div class="sig"><div class="sigbox">${p.signature?`<img src="${p.signature}">`:''}<div class="line">Approuvé par ${p.approvedBy?userName(p.approvedBy):'____________'}${p.approverType?' ('+p.approverType+')':''}</div></div><div class="sigbox"><div class="line">Le bénéficiaire</div></div></div><div class="noprint" style="margin-top:26px;text-align:right;"><button class="btn" onclick="window.print()">Imprimer / Enregistrer en PDF</button></div></div></body></html>`;const w=window.open('','_blank');if(!w){toast('Autorisez les pop-ups pour générer le bon de paiement.');return;}w.document.write(html);w.document.close();audit('BON_PAIEMENT','purchase',p.ref,p.montant);}
